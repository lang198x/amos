name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, Clippy, coverage (the Linux test run), a build and test on macOS
  # and Windows, and workflow lint, shared by every 198x Rust repo
  # (stevehill1981/198x-workflows). The toolchain is rust-toolchain.toml's.
  rust:
    name: Rust
    uses: stevehill1981/198x-workflows/.github/workflows/rust-ci.yml@v1
    with:
      # Measured 98.24% on 2026-10-23. Ratchet up as tests grow; never down.
      coverage-floor: 95

  # The parts of AMOS that aren't Rust: the Python tests, the npm package and
  # its tests, and the VS Code extension build.
  packages:
    name: Packages and editor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
      - run: npm run check:editor
      - run: python3 scripts/package-editor.py --pre-release --public
      - run: npm pack --pack-destination dist

  # Pull requests do not fuzz: a time-boxed run is not repeatable, so it could
  # fail a pull request that did not cause the problem. Fuzzing runs weekly in
  # fuzz.yml instead, and every crash it finds becomes a seed or test that the
  # ordinary tests run here. This job only keeps the fuzz target building
  # against the current API, with an up-to-date lockfile.
  fuzz-targets:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A release raises this crate's own version, which the fuzz lockfile
      # also records. Only that entry is brought in line before the --locked
      # check, so drift in any other dependency still fails.
      - name: Check the fuzz target builds
        run: |
          version=$(cargo pkgid --manifest-path Cargo.toml | sed 's/.*[@#]//')
          sed -i "/^name = \"lang198x-amos\"\$/{n;s/^version = .*/version = \"$version\"/}" fuzz/Cargo.lock
          cargo check --manifest-path fuzz/Cargo.toml --locked --bins
