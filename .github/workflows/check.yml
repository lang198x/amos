name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Rust tools
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo +stable fmt --check
      - run: cargo +stable test --locked
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: npm test
      - run: npm run check:editor
      - run: python3 scripts/package-editor.py --pre-release
      - run: npm pack --pack-destination dist
