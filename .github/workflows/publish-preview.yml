name: Publish preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published preview tag with committed release evidence
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-preview-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'lang198x/amos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify and publish the approved archive
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir artifacts
          gh api "repos/lang198x/amos/releases/tags/$RELEASE_TAG" > artifacts/release.json
          gh release download "$RELEASE_TAG" --repo lang198x/amos --dir artifacts
          python3 scripts/verify-preview-release.py "$RELEASE_TAG" artifacts
          npm publish "artifacts/lang198x-amos-${RELEASE_TAG#v}.tgz" --tag next --access public
